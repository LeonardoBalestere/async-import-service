# Dev-grade: 1 réplica com PVC (o kind provisiona via local-path).
# Em produção: CloudNativePG ou banco gerenciado — banco em Deployment simples
# não sobrevive a re-agendamento com integridade garantida.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: import-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: import-service
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC ReadWriteOnce: nunca duas réplicas no mesmo volume
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: import
            - name: POSTGRES_PASSWORD
              value: import
            - name: POSTGRES_DB
              value: importdb
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "import", "-d", "importdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: import-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
